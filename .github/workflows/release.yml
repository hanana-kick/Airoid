name: Release (GitHub)

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 29
        run: sdkmanager "ndk;29.0.14206865"

      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Dump ffmpeg configure log (on failure)
        if: failure()
        run: |
          ls -la app/src/main/cpp/third_party/ffmpeg/configure
          head -1 app/src/main/cpp/third_party/ffmpeg/configure | xxd | head -2
          ls /usr/local/lib/android/sdk/ndk/*/toolchains/llvm/prebuilt/*/bin/ | grep -E "clang" | head -5
          find app/.cxx -name "ffmpeg_ep-configure-out.log" -exec sh -c 'echo "=== OUT $1"; cat "$1"' _ {} \;
          find app/.cxx -name "ffmpeg_ep-configure-err.log" -exec sh -c 'echo "=== ERR $1"; cat "$1"' _ {} \;

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
